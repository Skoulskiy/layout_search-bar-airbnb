<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Airbnb Search Bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="container">
      <form
        class="search-field search-field--big"
        data-qa="big"
      >
        <div class="search-field__img"></div>
        <input
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
          class="search-field__input"
        />
      </form>

      <form
        class="search-field search-field--small"
        data-qa="small"
      >
        <div class="search-field__img"></div>
        <input
          type="text"
          placeholder="Try &#34;Los Angeles&#34;"
          class="search-field__input search-field__input--small"
        />
      </form>
    </div>
  </body>
</html>
